name: chess_on_dart
description: A high-performance bitboard chess engine for native Dart. Supports standard chess, Chess960, King of the Hill, Three-Check variants, FEN/PGN import/export, and SAN/UCI move formats.
version: 0.1.0
homepage: https://github.com/chesshere-com/chess-on-dart
repository: https://github.com/chesshere-com/chess-on-dart
issue_tracker: https://github.com/chesshere-com/chess-on-dart/issues
topics:
  - chess
  - game-engine
  - bitboard
  - chess-variants
  - flutter

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  meta: ^1.11.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.6
